#:schema https://developers.openai.com/codex/config-schema.json

# Shared user-level Codex configuration managed by the dotfiles repository.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
writable_roots = [
    "/home/nizio/git/personal",
    "/home/nizio/.dotfiles",
]

[projects."/home/nizio"]
trust_level = "trusted"

[projects."/mnt/c/Users/nizio"]
trust_level = "trusted"

[projects."/home/nizio/git/personal/cockroach"]
trust_level = "trusted"

[projects."/mnt/c/Users/nizio/test"]
trust_level = "trusted"

[projects."/mnt/c/Users/nizio/test/laughing-robot"]
trust_level = "trusted"

[projects."/home/nizio/.dotfiles"]
trust_level = "trusted"

[marketplaces.kernel]
source_type = "git"
source = "https://github.com/kernel/skills.git"

[plugins."generate-video@kernel"]
enabled = true

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 2

[mcp_servers.robloxstudio]
command = "npx"
args = ["-y", "@chrrxs/robloxstudio-mcp@latest", "--auto-install-plugin"]
